# Reusable trusted comment-poster — called by the per-repo
# tutorial-pr-comment.yml caller (workflow_run) in each content repo.
#
# Because this runs as a workflow_call, the github context reflects the
# ORIGINAL event that started the caller's workflow_run run, so
# github.event.workflow_run.id / .event / .head_sha etc. are all available.
#
# Org secrets are accessible here (workflow_call reusable workflows inherit
# the caller's secret context via `secrets: inherit`), which is the whole
# point of the two-workflow fork-safe split:
#   pull_request run  — untrusted, read-only GITHUB_TOKEN, no secrets
#   workflow_run caller → this reusable  — trusted, secrets present
#
# This workflow never touches PR merge-ability — notify only.

# TODO(hardening): SHA-pin all actions (actions/checkout, actions/download-artifact,
# actions/create-github-app-token, marocchino/sticky-pull-request-comment) —
# separate hardening pass.

name: Post Tutorial CI Results

on:
  workflow_call:

# GITHUB_TOKEN needs actions:read to download the workflow_run artifact and
# contents:read to checkout tutorial-ci's (public) normaliser script.
# Write access to the cross-repo PR comment comes from the App token (step 3).
permissions:
  actions: read
  contents: read

jobs:
  post-comment:
    runs-on: ubuntu-latest
    # Guard: skip non-PR workflow runs (e.g. push events on the calling repo).
    if: github.event.workflow_run.event == 'pull_request'

    steps:
      # ── 1. Download findings + pr-meta artifact from the triggering run ──────
      - name: Download tutorial-ci-findings artifact
        uses: actions/download-artifact@v4
        with:
          name: tutorial-ci-findings
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Parse pr-meta.json into step outputs (injection-safe heredoc form) ─
      #    Shape (written by tutorial-pr-checks.yml step 9):
      #      { pr_number, head_sha, base_sha, repo }
      #    where repo = "owner/name".
      #    owner     — used by create-github-app-token (derived, not hardcoded)
      #    repo_name — bare name used by create-github-app-token `repositories:`
      - name: Read pr-meta.json
        id: meta
        run: |
          { echo "pr_number<<GHEOF"; jq -r '.pr_number'                pr-meta.json; echo "GHEOF"; } >> "$GITHUB_OUTPUT"
          { echo "head_sha<<GHEOF";  jq -r '.head_sha'                 pr-meta.json; echo "GHEOF"; } >> "$GITHUB_OUTPUT"
          { echo "repo<<GHEOF";      jq -r '.repo'                     pr-meta.json; echo "GHEOF"; } >> "$GITHUB_OUTPUT"
          { echo "owner<<GHEOF";     jq -r '.repo | split("/") | first' pr-meta.json; echo "GHEOF"; } >> "$GITHUB_OUTPUT"
          { echo "repo_name<<GHEOF"; jq -r '.repo | split("/") | last'  pr-meta.json; echo "GHEOF"; } >> "$GITHUB_OUTPUT"

      # ── 3. Mint an App token scoped to the source content repo ───────────────
      #    owner is derived from pr-meta.repo — not hardcoded — so this works
      #    for any org whose content repos call this reusable workflow.
      #    The token is scoped to the single content repo (minimal blast radius).
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.TUTORIALS_APP_ID }}
          private-key: ${{ secrets.TUTORIALS_APP_PRIVATE_KEY }}
          owner: ${{ steps.meta.outputs.owner }}
          repositories: ${{ steps.meta.outputs.repo_name }}

      # ── 4. Sparse-checkout the normaliser script into a subdirectory ─────────
      #    Uses path:_ci so artifact files in the workspace root are not
      #    clobbered.  package.json is included so Node resolves the ESM
      #    module type from tutorial-ci's package.json when we dynamic-import
      #    normalize-findings.js.
      - name: Checkout tutorial-ci scripts
        uses: actions/checkout@v4
        with:
          repository: sap-tutorials/tutorial-ci
          ref: v1
          sparse-checkout: |
            scripts/normalize-findings.js
            config/notify-teams.json
            package.json
          sparse-checkout-cone-mode: false
          path: _ci

      # ── 5. Error-severity gate + assigned-team lookup (fail-open) ────────────
      #    Only when a finding is ERROR severity do we look up the team(s)
      #    assigned to the content repo and build @org/team mentions. Warnings
      #    and notices post silently (no ping — avoid alerting teams on advisory
      #    notices). The team lookup NEVER fails the job: any error (including
      #    the App token lacking org "Members: read" — see PR body) degrades to
      #    posting the comment with no mention.
      #
      #    ALLOWLIST FILTER: the raw team list is filtered to the configured
      #    content-owner teams in config/notify-teams.json (glob-aware) via the
      #    shared buildTeamMentions() helper — so glob semantics live in exactly
      #    ONE place (JS, unit-tested) instead of being duplicated in jq. An
      #    empty/missing allowlist mentions NO ONE (fail-safe). This is what
      #    keeps a content-check failure from paging securityalerts / monitor /
      #    admins on content-heavy repos like sap-tutorials/Tutorials.
      #
      #    PERMISSIONS NOTE: GET /repos/{owner}/{repo}/teams needs the App
      #    installation to grant organization "Members: read". A repo-scoped
      #    token without it typically yields 403/empty — handled here as
      #    fail-open (empty mentions). See PR body "App permission prerequisite".
      - name: Compute error gate and team mentions
        id: mentions
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ steps.meta.outputs.owner }}
          REPO_NAME: ${{ steps.meta.outputs.repo_name }}
        run: |
          set -uo pipefail
          has_error=$(jq -r 'if any(.[]; .severity == "error") then "true" else "false" end' findings.json)
          echo "has_error=$has_error"
          mentions=""
          if [ "$has_error" = "true" ]; then
            if teams_json=$(gh api "repos/${OWNER}/${REPO_NAME}/teams" --paginate 2>/tmp/teams_err); then
              printf '%s' "$teams_json" > /tmp/teams.json
              # Filter to the config/notify-teams.json allowlist (glob-aware)
              # through the shared JS helper — single source of truth for the
              # matching rules, exercised by test/normalize-findings.test.js.
              mentions=$(OWNER="$OWNER" node - <<'NODESCRIPT'
          (async () => {
            const fs = require('fs');
            const { buildTeamMentions } = await import('./_ci/scripts/normalize-findings.js');
            let allowlist = [];
            try {
              const cfg = JSON.parse(fs.readFileSync('./_ci/config/notify-teams.json', 'utf8'));
              if (Array.isArray(cfg.teamSlugAllowlist)) allowlist = cfg.teamSlugAllowlist;
            } catch { /* missing/invalid config → empty allowlist → mention none */ }
            let teams = [];
            try { teams = JSON.parse(fs.readFileSync('/tmp/teams.json', 'utf8')); } catch { /* keep [] */ }
            process.stdout.write(buildTeamMentions(teams, process.env.OWNER, allowlist).join(' '));
          })().catch(() => process.exit(0)); // fail-open: never fail the job on a mention build error
          NODESCRIPT
          )
              if [ -z "$mentions" ]; then
                echo "::notice::No allowlisted content-owner teams for ${OWNER}/${REPO_NAME}; posting without mention."
              else
                echo "Allowlisted team mentions: $mentions"
              fi
            else
              echo "::warning::Could not read teams for ${OWNER}/${REPO_NAME} (fail-open, posting without mention). $(cat /tmp/teams_err 2>/dev/null || true)"
            fi
          fi
          { echo "mentions<<GHEOF"; printf '%s\n' "$mentions"; echo "GHEOF"; } >> "$GITHUB_OUTPUT"

      # ── 6. Render the sticky comment body ────────────────────────────────────
      #    Dynamic import (await import()) loads the ESM renderComment export
      #    correctly from a node - (CJS stdin eval) entry point.
      #    _ci/package.json declares "type":"module" so Node treats the import
      #    target as ESM automatically. MENTIONS is empty on non-error runs, so
      #    renderComment appends nothing (silent for warnings/notices).
      - name: Build comment.md
        env:
          MENTIONS: ${{ steps.mentions.outputs.mentions }}
        run: |
          node - <<'NODESCRIPT'
          (async () => {
            const fs = require('fs');
            const { renderComment } = await import('./_ci/scripts/normalize-findings.js');
            const findings = JSON.parse(fs.readFileSync('findings.json', 'utf8'));
            const meta    = JSON.parse(fs.readFileSync('pr-meta.json',   'utf8'));
            const mentions = (process.env.MENTIONS || '').trim().split(/\s+/).filter(Boolean);
            fs.writeFileSync('comment.md', renderComment(findings, { sha: meta.head_sha, mentions }));
          })().catch(e => { console.error(e); process.exit(1); });
          NODESCRIPT

      # ── 7. Post or update the sticky comment on the source PR ────────────────
      #    marocchino/sticky-pull-request-comment rewrites the single comment
      #    keyed on `header: tutorial-ci` — repeated pushes update rather than
      #    accumulate duplicates.
      #    `repo` + `number` target the content repo's PR (not tutorial-ci).
      #    `token` is the App token with write access to that repo.
      - name: Post sticky comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          header: tutorial-ci
          number: ${{ steps.meta.outputs.pr_number }}
          repo: ${{ steps.meta.outputs.repo_name }}
          path: comment.md
