# Reusable trusted comment-poster — called by the per-repo
# tutorial-pr-comment.yml caller (workflow_run) in each content repo.
#
# Because this runs as a workflow_call, the github context reflects the
# ORIGINAL event that started the caller's workflow_run run, so
# github.event.workflow_run.id / .event / .head_sha etc. are all available.
#
# Org secrets are accessible here (workflow_call reusable workflows inherit
# the caller's secret context via `secrets: inherit`), which is the whole
# point of the two-workflow fork-safe split:
#   pull_request run  — untrusted, read-only GITHUB_TOKEN, no secrets
#   workflow_run caller → this reusable  — trusted, secrets present
#
# This workflow never touches PR merge-ability — notify only.

# TODO(hardening): SHA-pin all actions (actions/checkout, actions/download-artifact,
# actions/create-github-app-token, marocchino/sticky-pull-request-comment) —
# separate hardening pass.

name: Post Tutorial CI Results

on:
  workflow_call:

# GITHUB_TOKEN needs actions:read to download the workflow_run artifact and
# contents:read to checkout tutorial-ci's (public) normaliser script.
# Write access to the cross-repo PR comment comes from the App token (step 3).
permissions:
  actions: read
  contents: read

jobs:
  post-comment:
    runs-on: ubuntu-latest
    # Guard: skip non-PR workflow runs (e.g. push events on the calling repo).
    if: github.event.workflow_run.event == 'pull_request'

    steps:
      # ── 1. Download findings + pr-meta artifact from the triggering run ──────
      - name: Download tutorial-ci-findings artifact
        uses: actions/download-artifact@v4
        with:
          name: tutorial-ci-findings
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Parse pr-meta.json into step outputs (injection-safe heredoc form) ─
      #    Shape (written by tutorial-pr-checks.yml step 9):
      #      { pr_number, head_sha, base_sha, repo }
      #    where repo = "owner/name".
      #    owner     — used by create-github-app-token (derived, not hardcoded)
      #    repo_name — bare name used by create-github-app-token `repositories:`
      - name: Read pr-meta.json
        id: meta
        run: |
          { echo "pr_number<<GHEOF"; jq -r '.pr_number'                pr-meta.json; echo "GHEOF"; } >> "$GITHUB_OUTPUT"
          { echo "head_sha<<GHEOF";  jq -r '.head_sha'                 pr-meta.json; echo "GHEOF"; } >> "$GITHUB_OUTPUT"
          { echo "repo<<GHEOF";      jq -r '.repo'                     pr-meta.json; echo "GHEOF"; } >> "$GITHUB_OUTPUT"
          { echo "owner<<GHEOF";     jq -r '.repo | split("/") | first' pr-meta.json; echo "GHEOF"; } >> "$GITHUB_OUTPUT"
          { echo "repo_name<<GHEOF"; jq -r '.repo | split("/") | last'  pr-meta.json; echo "GHEOF"; } >> "$GITHUB_OUTPUT"

      # ── 3. Mint an App token scoped to the source content repo ───────────────
      #    owner is derived from pr-meta.repo — not hardcoded — so this works
      #    for any org whose content repos call this reusable workflow.
      #    The token is scoped to the single content repo (minimal blast radius).
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.TUTORIALS_APP_ID }}
          private-key: ${{ secrets.TUTORIALS_APP_PRIVATE_KEY }}
          owner: ${{ steps.meta.outputs.owner }}
          repositories: ${{ steps.meta.outputs.repo_name }}

      # ── 4. Sparse-checkout the normaliser script into a subdirectory ─────────
      #    Uses path:_ci so artifact files in the workspace root are not
      #    clobbered.  package.json is included so Node resolves the ESM
      #    module type from tutorial-ci's package.json when we dynamic-import
      #    normalize-findings.js.
      - name: Checkout tutorial-ci scripts
        uses: actions/checkout@v4
        with:
          repository: sap-tutorials/tutorial-ci
          ref: v1
          sparse-checkout: |
            scripts/normalize-findings.js
            package.json
          sparse-checkout-cone-mode: false
          path: _ci

      # ── 5. Render the sticky comment body ────────────────────────────────────
      #    Dynamic import (await import()) loads the ESM renderComment export
      #    correctly from a node - (CJS stdin eval) entry point.
      #    _ci/package.json declares "type":"module" so Node treats the import
      #    target as ESM automatically.
      - name: Build comment.md
        run: |
          node - <<'NODESCRIPT'
          (async () => {
            const fs = require('fs');
            const { renderComment } = await import('./_ci/scripts/normalize-findings.js');
            const findings = JSON.parse(fs.readFileSync('findings.json', 'utf8'));
            const meta    = JSON.parse(fs.readFileSync('pr-meta.json',   'utf8'));
            fs.writeFileSync('comment.md', renderComment(findings, { sha: meta.head_sha }));
          })().catch(e => { console.error(e); process.exit(1); });
          NODESCRIPT

      # ── 6. Post or update the sticky comment on the source PR ────────────────
      #    marocchino/sticky-pull-request-comment rewrites the single comment
      #    keyed on `header: tutorial-ci` — repeated pushes update rather than
      #    accumulate duplicates.
      #    `repo` + `number` target the content repo's PR (not tutorial-ci).
      #    `token` is the App token with write access to that repo.
      - name: Post sticky comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          header: tutorial-ci
          number: ${{ steps.meta.outputs.pr_number }}
          repo: ${{ steps.meta.outputs.repo_name }}
          path: comment.md
